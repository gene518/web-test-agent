[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-autotest-agent"
version = "0.1.0"
description = "A LangChain + LangGraph + Deep Agents baseline for web automation specialists."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.5.3,<0.8",
  "langchain>=1.2.15,<1.4",
  "langchain-anthropic>=1.4.1,<2",
  "langchain-mcp-adapters>=0.2.2,<0.4",
  "langchain-openai>=1.2.1,<2",
  "langgraph>=1.1.9,<1.3",
  "langgraph-sdk>=0.3.13,<0.4",
  "mcp>=1.27,<2",
  "pydantic>=2.13.3,<3",
  "pydantic-settings>=2.14,<3",
]

[project.scripts]
web-agent-scheduler = "deep_agent.scheduler.cli:main"

[project.optional-dependencies]
dev = [
  "langgraph-cli[inmem]>=0.4.24,<0.5",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deep_agent*"]

[tool.setuptools.package-data]
deep_agent = [
  "assets/demo/*",
  "assets/demo/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
