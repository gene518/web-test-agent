# 在所有 PR 上验证后端、桌面客户端和平台启动脚本。

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: web-agent/uv.lock
      - name: 安装后端依赖
        working-directory: web-agent
        run: uv sync --frozen --extra dev
      - name: 运行后端测试
        working-directory: web-agent
        run: uv run pytest -q

  client-frontend:
    name: 桌面客户端前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.5.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: web-agent-client/pnpm-lock.yaml
      - name: 安装客户端依赖
        working-directory: web-agent-client
        run: pnpm install --frozen-lockfile
      - name: 检查类型、测试和构建
        working-directory: web-agent-client
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

  windows-startup-check:
    name: 检查 Windows 启动脚本
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: 检查 PowerShell 语法
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $scriptPath = Resolve-Path "start/windows-start.ps1"
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  web-agent-client-windows:
    name: 构建 Windows 桌面客户端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.5.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: web-agent-client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-agent-client/src-tauri
      - name: 安装客户端依赖
        working-directory: web-agent-client
        run: pnpm install --frozen-lockfile
      - name: 检查 Rust
        working-directory: web-agent-client/src-tauri
        run: |
          cargo test --locked
          cargo check --locked
      - name: 构建未签名 NSIS 安装包
        working-directory: web-agent-client
        run: pnpm tauri build --bundles nsis
      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v7
        with:
          name: web-test-agent-windows-unsigned
          path: web-agent-client/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
