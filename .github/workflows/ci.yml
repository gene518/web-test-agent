# 在所有 PR 上验证后端、桌面客户端和平台启动脚本。

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: web-agent/uv.lock
      - name: 安装后端依赖
        working-directory: web-agent
        run: uv sync --frozen --extra dev
      - name: 运行后端测试
        working-directory: web-agent
        run: uv run pytest -q --cov=deep_agent --cov-report=term-missing
      - name: 检查后端静态质量
        working-directory: web-agent
        run: uv run ruff check deep_agent tests
      - name: 检查容器更新控制面
        run: |
          python -m unittest discover -s deploy/updater -p 'test_*.py'
          python -m py_compile deploy/updater/common.py deploy/updater/service.py deploy/updater/reconcile.py
      - name: 验证 Python 发布包包含运行资源
        working-directory: web-agent
        run: |
          uv build
          unzip -l dist/*.whl | grep -q "deep_agent/assets/demo/package.json"
          unzip -l dist/*.whl | grep -q "deep_agent/assets/demo/playwright.config.ts"
          unzip -l dist/*.whl | grep -q "deep_agent/assets/demo/test_case/shared/base-test.ts"

  client-frontend:
    name: 桌面客户端前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.5.1
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: web-agent-client/pnpm-lock.yaml
      - name: 安装客户端依赖
        working-directory: web-agent-client
        run: pnpm install --frozen-lockfile
      - name: 检查类型、测试和构建
        working-directory: web-agent-client
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm audit --prod
      - name: 安装 E2E 浏览器
        working-directory: web-agent-client
        run: pnpm exec playwright install --with-deps chromium
      - name: 运行客户端 E2E
        working-directory: web-agent-client
        run: pnpm test:e2e
      - name: 运行 H5 更新 E2E
        working-directory: web-agent-client
        env:
          VITE_DEPLOYMENT_MODE: container
        run: pnpm test:e2e tests/e2e/h5-update.spec.ts

  windows-startup-check:
    name: 检查 Windows 启动脚本
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: 检查 PowerShell 语法
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($scriptPath in @(
            (Resolve-Path "start/windows-start.ps1"),
            (Resolve-Path "start/build-windows-x64-portable.ps1")
          )) {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$scriptPath`: $($_.Message)" }
              exit 1
            }
          }

  web-agent-client-windows:
    name: 构建 Windows 桌面客户端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.5.1
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: web-agent-client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-agent-client/src-tauri
      - name: 安装客户端依赖
        working-directory: web-agent-client
        run: pnpm install --frozen-lockfile
      - name: 检查 Rust
        working-directory: web-agent-client/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo check --locked
      - name: 构建未签名 NSIS 安装包
        working-directory: web-agent-client
        run: pnpm tauri build --bundles nsis
      - uses: actions/setup-python@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          enable-cache: true
          cache-dependency-glob: web-agent/uv.lock
      - name: 构建 Windows x64 免安装包
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: .\start\build-windows-x64-portable.ps1
      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v6
        with:
          name: web-test-agent-windows-unsigned
          path: web-agent-client/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: 上传 Windows x64 免安装包
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: web-test-agent-windows-x64-portable
          path: |
            dist/windows-x64/*-portable.zip
            dist/windows-x64/*-portable.zip.sha256
          if-no-files-found: error
          retention-days: 7

  container-publish:
    name: 发布 H5 容器镜像
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-test
      - client-frontend
      - windows-startup-check
      - web-agent-client-windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: 绑定当前 CI 提交
        id: revision
        env:
          OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! echo "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "invalid source revision: $SOURCE_SHA" >&2
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: 验证检出的当前 CI 提交
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVISION"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.4.1

      - name: 构建 Agent 镜像
        id: agent
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.agent
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_SHA=${{ steps.revision.outputs.sha }}
          tags: |
            ghcr.io/${{ steps.revision.outputs.owner }}/web-test-agent-agent:main
            ghcr.io/${{ steps.revision.outputs.owner }}/web-test-agent-agent:sha-${{ steps.revision.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: 构建 Web 镜像
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_SHA=${{ steps.revision.outputs.sha }}
          tags: |
            ghcr.io/${{ steps.revision.outputs.owner }}/web-test-agent-web:main
            ghcr.io/${{ steps.revision.outputs.owner }}/web-test-agent-web:sha-${{ steps.revision.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: 构建 Updater 镜像
        id: updater
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/updater/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.revision.outputs.owner }}/web-test-agent-updater:main
            ghcr.io/${{ steps.revision.outputs.owner }}/web-test-agent-updater:sha-${{ steps.revision.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

      - name: 签名不可变镜像
        env:
          PREFIX: ghcr.io/${{ steps.revision.outputs.owner }}/web-test-agent
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          UPDATER_DIGEST: ${{ steps.updater.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$PREFIX-agent@$AGENT_DIGEST"
          cosign sign --yes "$PREFIX-web@$WEB_DIGEST"
          cosign sign --yes "$PREFIX-updater@$UPDATER_DIGEST"
